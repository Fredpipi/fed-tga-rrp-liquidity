name: Update liquidity indicator

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-liquidity-indicator
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update liquidity data and pages
        run: python3 scripts/update_liquidity.py

      - name: Commit updated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv data/*.json reports/*.svg reports/*.md index.html
          git add reports/*.png 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No liquidity output changes to commit."
          else
            git commit -m "Update liquidity indicator"
            git push
          fi
