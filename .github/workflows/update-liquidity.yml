name: Update liquidity indicator

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-liquidity-indicator
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update liquidity data and pages
        run: python3 scripts/update_liquidity.py

      - name: Commit updated outputs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update liquidity indicator
          file_pattern: data/*.csv data/*.json reports/*.svg reports/*.png reports/*.md index.html
